packages:
  device: !include device.yaml

external_components:
  - source:
      type: local
      path: ..

text_sensor:
  - platform: host_command
    name: "Run date every 10s"
    update_interval: 10s

    # These are component-spesific options for the host_command text sensor
    executable: /usr/bin/date
    arguments:
      - --iso=s
    logging:
      arguments: true
      exit_status: true
      stderr: true
      stdin: true
      stdout: true
